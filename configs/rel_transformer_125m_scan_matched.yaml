# REL Transformer SCAN — matched to std SCAN config for fair comparison
# Matches: lr=5e-5, patience=30, eval_by_em=True, max_steps=200K
# Differs from old rel_transformer_125m_scan.yaml (which had lr=2e-4, batch_size=64)
model_type: relational
hidden_dim: 512
num_encoder_layers: 12
num_decoder_layers: 12
num_heads: 8
num_attributes: 8
ffn_dim: 2048
max_seq_len: 512
dropout: 0.1
vocab_size: 32000
learning_rate: 5.0e-05
weight_decay: 0.01
warmup_steps: 4000
max_steps: 200000
batch_size: 16
gradient_accumulation: 4
max_grad_norm: 1.0
label_smoothing: 0.05
eval_every: 1000
save_every: 10000
patience: 30
eval_by_em: true
max_src_len: 128
max_tgt_len: 128
fp16: false
num_workers: 4
log_every: 100
copy_mechanism: false
