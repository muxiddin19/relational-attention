# STD Transformer Spider — CORRECTED config (fp32, lr=8e-5, 300K steps, eval_by_em)
model_type: standard
hidden_dim: 512
num_encoder_layers: 12
num_decoder_layers: 12
num_heads: 8
num_attributes: 1
ffn_dim: 2048
max_seq_len: 512
dropout: 0.1
vocab_size: 32000
learning_rate: 8.0e-5
weight_decay: 0.01
warmup_steps: 4000
max_steps: 300000
batch_size: 4
gradient_accumulation: 16
max_grad_norm: 1.0
label_smoothing: 0.05
eval_every: 2000
save_every: 20000
patience: 30
eval_by_em: true
max_src_len: 384
max_tgt_len: 200
fp16: false
num_workers: 4
log_every: 100
copy_mechanism: false
